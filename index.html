<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYD Kaizen Mobile</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#08111f;
color:white;
padding:15px;
}

.container{
max-width:500px;
margin:auto;
}

.card{
background:#111b2d;
padding:20px;
border-radius:20px;
margin-top:20px;
border:1px solid rgba(255,255,255,.08);
}

h1{
font-size:24px;
margin-bottom:5px;
}

.sub{
font-size:12px;
opacity:.7;
margin-bottom:20px;
}

label{
display:block;
margin-top:14px;
margin-bottom:5px;
font-size:13px;
font-weight:bold;
}

input,select,textarea{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#0b1322;
color:white;
box-sizing:border-box;
}

textarea{
min-height:100px;
resize:vertical;
}

button{
width:100%;
padding:16px;
margin-top:20px;
border:none;
border-radius:14px;
background:#e51b23;
color:white;
font-weight:bold;
font-size:15px;
}

.logo{
width:240px;
display:block;
margin:auto;
margin-top:15px;
filter:
drop-shadow(0 0 8px rgba(229,27,35,.5))
drop-shadow(0 0 20px rgba(229,27,35,.25));
}

.footer{
margin-top:35px;
text-align:center;
opacity:.95;
}

.footer img{
width:260px;
filter:
drop-shadow(0 0 8px rgba(229,27,35,.5))
drop-shadow(0 0 20px rgba(229,27,35,.25));
}

</style>

</head>

<body>

<div class="container">

<img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/3/33/BYD_Auto_2022_logo.svg">

<div class="card">

<h1>Nova Sugestão</h1>

<div class="sub">
Sistema Mobile • Lean Manufacturing • BYD
</div>

<label>Nome operador</label>
<input>

<label>Matrícula</label>
<input>

<label>Área / Linha</label>

<select>

<option>Trim 1</option>
<option>Trim 2</option>
<option>Trim 3</option>
<option>Trim 4</option>
<option>Chassis 1</option>
<option>Chassis 2</option>
<option>Ev Line 1</option>
<option>Ev Line 2</option>
<option>Final Line</option>
<option>OK Line</option>
<option>SubAssembly</option>

</select>

<label>Estação</label>
<input>

<label>Categoria</label>

<select>

<option>Segurança</option>
<option>Ergonomia</option>
<option>Qualidade</option>
<option>Lean Manufacturing</option>
<option>Produtividade</option>
<option>Redução de custos</option>
<option>Logística</option>
<option>Processo</option>
<option>Outros</option>

</select>

<label>Problema identificado</label>
<textarea></textarea>

<label>Proposta de melhoria</label>
<textarea></textarea>

<label>Foto antes</label>
<input type="file">

<label>Foto depois</label>
<input type="file">

<button>
ENVIAR SUGESTÃO
</button>

</div>

<div class="footer">

<img src="https://upload.wikimedia.org/wikipedia/commons/3/33/BYD_Auto_2022_logo.svg">

</div>

</div>

</body>
</html>
